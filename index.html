<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>TON Rocket Gift System</title>
    <style>
        :root { --bg: #0b0e14; --blue: #2483ff; --gold: #f59e0b; --card: #1c212d; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; direction: rtl; }
        
        /* تصميم الواجهة */
        .game-area { height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #1a233a 0%, #0b0e14 100%); position: relative; }
        #multiplier { font-size: 55px; font-weight: bold; }
        
        /* قائمة اللاعبين */
        .player-list { padding: 10px; height: 300px; overflow-y: auto; }
        .player-card { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2d344b; }
        
        /* شكل الهدية داخل القائمة */
        .gift-box { display: flex; align-items: center; gap: 5px; background: rgba(245, 158, 11, 0.1); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--gold); }
        .gift-img { width: 24px; height: 24px; }
        
        .controls { position: fixed; bottom: 0; width: 100%; padding: 20px; background: #151921; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--blue); color: white; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-area">
        <div id="multiplier">1.00x</div>
    </div>

    <div class="player-list" id="pList">
        </div>

    <div class="controls">
        <button class="btn" id="mainBtn">Place Bet</button>
    </div>

    <script>
        let m = 1.0;
        let isRunning = false;
        // روابط صور الهدايا (تقدر تغيرها لأي صور تريدها)
        const giftImage = "https://cdn-icons-png.flaticon.com/512/2143/2143150.png"; 

        const names = ["JOKER", "ANAS", "Tower", "MaZi", "Ali"];
        let players = names.map(n => ({
            name: n,
            bet: (Math.random() * 5).toFixed(2),
            target: (Math.random() * 4 + 1.2).toFixed(2)
        }));

        function updateGame() {
            if(!isRunning) return;
            m += 0.01;
            document.getElementById('multiplier').innerText = m.toFixed(2) + "x";
            
            const list = document.getElementById('pList');
            list.innerHTML = '';

            players.forEach(p => {
                let statusContent;
                
                // التعديل المطلوب: إذا العداد وصل 2.5 أو اللاعب ربح بعد الـ 2.5 تظهر هدية
                if (m >= 2.5 || (p.target <= m && p.target >= 2.5)) {
                    statusContent = `
                        <div class="gift-box">
                            <img src="${giftImage}" class="gift-img">
                            <span style="color:#f59e0b; font-size:12px;">Premium Gift</span>
                        </div>`;
                } else {
                    // قبل الـ 2.5 يظهر رقم التون العادي
                    let currentWin = (p.bet * (m < p.target ? m : p.target)).toFixed(2);
                    statusContent = `<span style="color:#10b981">${currentWin} TON</span>`;
                }

                list.innerHTML += `
                    <div class="player-card">
                        <span>${p.name}</span>
                        <div>${statusContent}</div>
                    </div>`;
            });

            if(m > 5) { isRunning = false; setTimeout(reset, 2000); }
            requestAnimationFrame(updateGame);
        }

        function reset() {
            m = 1.0;
            isRunning = true;
            updateGame();
        }

        // تشغيل تلقائي للتجربة
        isRunning = true;
        updateGame();
    </script>
