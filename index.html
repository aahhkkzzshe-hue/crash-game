<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Crash Final</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0e14; color: white; font-family: sans-serif; direction: rtl; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 1. رأس الصفحة */
        .header { height: 60px; background: #151921; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #2d344b; flex-shrink: 0; }
        .bal-box { background: #0c0f15; padding: 5px 12px; border-radius: 10px; border: 1px solid #2d344b; display: flex; align-items: center; gap: 5px; font-weight: bold; }

        /* 2. منطقة اللعب (ثابتة) */
        .game-zone { height: 200px; background: radial-gradient(circle, #1a233a 0%, #0b0e14 100%); position: relative; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        #mult { font-size: 50px; font-weight: 900; color: white; z-index: 10; }
        #timer { position: absolute; width: 70px; height: 70px; border: 4px solid #2483ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; background: rgba(0,0,0,0.5); }
        #rocket { position: absolute; bottom: 20px; right: 20px; width: 70px; display: none; }

        /* 3. قائمة اللاعبين (تاخذ المساحة الباقية وتتحرك) */
        .list-zone { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0b0e14; }
        .card { display: flex; justify-content: space-between; align-items: center; background: #151921; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #252b3d; }
        .gift-tag { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #f59e0b; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        /* 4. لوحة التحكم (ثابتة بالأسفل) */
        .control-zone { height: 160px; background: #151921; border-top: 1px solid #252b3d; padding: 15px; flex-shrink: 0; }
        .input-row { display: flex; background: #0b0e14; border-radius: 10px; padding: 8px; margin-bottom: 12px; border: 1px solid #2d344b; align-items: center; }
        .input-row input { flex-grow: 1; background: none; border: none; color: white; text-align: center; font-size: 18px; outline: none; }
        .btn { width: 100%; height: 55px; background: #2483ff; border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn.cash { background: #f59e0b; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color:#10b981; font-size:12px;">● LIVE SESSION</div>
        <div class="bal-box"><span id="userBal">1000.00</span> <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="14"></div>
    </div>

    <div class="game-zone">
        <div id="mult" style="display:none">1.00x</div>
        <div id="timer">5</div>
        <img id="rocket" src="https://i.postimg.cc/pT7L6L8v/rocket.png">
    </div>

    <div class="list-zone" id="playerArea">
        </div>

    <div class="control-zone">
        <div class="input-row">
            <button onclick="adjust(0.5)" style="color:#2483ff; background:none; border:none; padding:0 10px;">/2</button>
            <input type="number" id="betInp" value="10.0">
            <button onclick="adjust(2)" style="color:#2483ff; background:none; border:none; padding:0 10px;">x2</button>
        </div>
        <button class="btn" id="btnMain" onclick="handle()">Place Bet</button>
    </div>

    <script>
        let balance = 1000, m = 1.0, state = "WAIT", loop, limit;
        const names = ["حمزة", "كرار", "مقتدى", "عباس", "حسين"];

        function adjust(f) { document.getElementById('betInp').value = (parseFloat(document.getElementById('betInp').value) * f).toFixed(1); }

        function init() {
            state = "WAIT"; m = 1.0;
            document.getElementById('mult').style.display = "none";
            document.getElementById('mult').style.color = "white";
            document.getElementById('timer').style.display = "flex";
            document.getElementById('rocket').style.display = "none";
            document.getElementById('btnMain').innerText = "Place Bet";
            document.getElementById('btnMain').classList.remove('cash');
            
            let s = 5;
            document.getElementById('timer').innerText = s;
            let cd = setInterval(() => {
                s--; document.getElementById('timer').innerText = s;
                if(s <= 0) { clearInterval(cd); start(); }
            }, 1000);
            render();
        }

        function start() {
            state = "RUN";
            document.getElementById('timer').style.display = "none";
            document.getElementById('mult').style.display = "block";
            document.getElementById('rocket').style.display = "block";
            limit = Math.random() * 5 + 1.1;

            loop = setInterval(() => {
                m += 0.01;
                document.getElementById('mult').innerText = m.toFixed(2) + "x";
                let pos = (m - 1) * 50;
                document.getElementById('rocket').style.transform = `translate(-${pos}px, -${pos}px) rotate(45deg)`;
                
                if(m >= 2.5) document.getElementById('mult').style.color = "#f59e0b";
                
                render();
                if(m >= limit) crash();
            }, 80);
        }

        function render() {
            const area = document.getElementById('playerArea');
            area.innerHTML = '';
            names.forEach(n => {
                let prize;
                if (m >= 2.5) {
                    prize = `<div class="gift-tag">🎁 GIFT</div>`;
                } else {
                    prize = `<span style="font-weight:bold; color:#2483ff;">${(10 * m).toFixed(2)}</span>`;
                }
                area.innerHTML += `<div class="card"><span>👤 ${n}</span>${prize}</div>`;
            });
        }

        function crash() {
            clearInterval(loop);
            state = "END";
            document.getElementById('mult').innerText = "💥";
            document.getElementById('btnMain').innerText = "Crashed!";
            setTimeout(init, 3000);
        }

        function handle() {
            if(state === "WAIT") {
                let v = parseFloat(document.getElementById('betInp').value);
                if(balance < v) return;
                balance -= v;
                document.getElementById('userBal').innerText = balance.toFixed(2);
                document.getElementById('btnMain').innerText = "Waiting...";
            }
        }

        init();
    </script>
</body>
</html>
