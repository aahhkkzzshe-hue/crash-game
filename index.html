<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Rocket Official Style</title>
    <style>
        :root { --tg-bg: #0f1218; --tg-card: #181c26; --accent: #2483ff; --gold: #f59e0b; --success: #10b981; }
        body { background: var(--tg-bg); color: white; font-family: -apple-system, sans-serif; margin: 0; direction: rtl; overflow: hidden; }
        
        /* Header & Balance */
        .header { display: flex; justify-content: space-between; padding: 12px 18px; align-items: center; background: #161a24; border-bottom: 1px solid #242b3a; }
        .bal-chip { background: #0c0f15; padding: 6px 14px; border-radius: 100px; display: flex; align-items: center; gap: 8px; border: 1px solid #2d364a; font-weight: 700; }

        /* Game Stage */
        .stage { height: 250px; position: relative; background: radial-gradient(circle at center, #1c263d 0%, #0b0e14 100%); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #multiplier { font-size: 60px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; }
        #rocket { position: absolute; bottom: 20px; right: 20px; width: 80px; z-index: 5; }

        /* Players List - Real Style */
        .players-list { height: calc(100vh - 540px); overflow-y: auto; padding: 12px; }
        .player-item { display: flex; justify-content: space-between; align-items: center; background: var(--tg-card); padding: 10px 14px; border-radius: 14px; margin-bottom: 8px; border: 1px solid #252c3b; }
        .p-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 34px; height: 34px; border-radius: 10px; background: #252c3b; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        
        /* Gift Badge in List */
        .gift-badge { background: linear-gradient(45deg, #f59e0b22, #f59e0b44); border: 1px solid var(--gold); border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }

        /* Bottom Controls */
        .controls { position: fixed; bottom: 0; width: 100%; background: #181c26; padding: 18px; border-top: 1px solid #252c3b; box-sizing: border-box; z-index: 100; }
        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 19px; font-weight: bold; color: white; background: var(--accent); transition: 0.2s; }
        .btn-main.cashout { background: var(--gold); box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }

        /* Timer Circle */
        #timer-wrap { position: absolute; width: 85px; height: 85px; border: 4px solid var(--accent); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; background: rgba(11, 14, 20, 0.8); }
    </style>
</head>
<body>

    <div class="header">
        <div style="color:var(--success); font-size:13px; font-weight:600;">● Live</div>
        <div class="bal-chip"><span id="userBal">1000.00</span> <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="16"></div>
    </div>

    <div class="stage" id="gameStage">
        <div id="multiplier" style="display:none">1.00x</div>
        <div id="timer-wrap"><span id="sec" style="font-size:32px; font-weight:bold;">5</span><span style="font-size:10px">Next Round</span></div>
        <img id="rocket" src="https://i.postimg.cc/pT7L6L8v/rocket.png" style="display:none">
    </div>

    <div class="players-list" id="pList"></div>

    <div class="controls">
        <button id="actionBtn" class="btn-main" onclick="onAction()">Place Bet</button>
    </div>

    <script>
        let balance = 1000, mult = 1.0, state = "WAIT", loop, bet = 10, limit;
        const names = ["Karrar", "Murtada", "Ali_88", "JOKER", "Anas", "Zaid"];

        function init() {
            state = "WAIT"; mult = 1.0;
            document.getElementById('multiplier').style.display = "none";
            document.getElementById('rocket').style.display = "none";
            document.getElementById('timer-wrap').style.display = "flex";
            document.getElementById('multiplier').style.color = "white";
            document.getElementById('actionBtn').innerText = "Place Bet";
            document.getElementById('actionBtn').className = "btn-main";
            
            let s = 5;
            document.getElementById('sec').innerText = s;
            let cd = setInterval(() => {
                s--; document.getElementById('sec').innerText = s;
                if(s <= 0) { clearInterval(cd); start(); }
            }, 1000);
            render(false);
        }

        function start() {
            state = "RUN";
            document.getElementById('timer-wrap').style.display = "none";
            document.getElementById('multiplier').style.display = "block";
            document.getElementById('rocket').style.display = "block";
            limit = Math.random() * 4.5 + 1.1;

            loop = setInterval(() => {
                mult += 0.01;
                let mText = document.getElementById('multiplier');
                mText.innerText = mult.toFixed(2) + "x";
                
                let move = (mult - 1) * 65;
                document.getElementById('rocket').style.transform = `translate(-${move}px, -${move}px) rotate(45deg)`;
                
                if(mult >= 2.5) mText.style.color = "var(--gold)";
                
                render(true);
                if(mult >= limit) crash();
            }, 75);
        }

        function render(isLive) {
            const list = document.getElementById('pList');
            list.innerHTML = '';
            names.forEach(n => {
                let status;
                // التحويل المطلوب للهدايا
                if (isLive && mult >= 2.5) {
                    status = `<div class="gift-badge"><img src="https://cdnn.iconscout.com/icon/free/png-256/free-telegram-gift-458051.png" width="18"><span style="color:var(--gold); font-size:12px; font-weight:800;">GIFT</span></div>`;
                } else {
                    status = `<span style="font-weight:700; color:${isLive ? 'var(--accent)' : '#8a91a8'}">${(10 * mult).toFixed(2)} TON</span>`;
                }

                list.innerHTML += `<div class="player-item">
                    <div class="p-info"><div class="avatar">${n[0]}</div><span>${n}</span></div>
                    ${status}
                </div>`;
            });
        }

        function crash() {
            clearInterval(loop);
            state = "END";
            document.getElementById('multiplier').innerText = "💥";
            document.getElementById('actionBtn').innerText = "Crashed!";
            document.getElementById('actionBtn').className = "btn-main";
            setTimeout(init, 3000);
        }

        function onAction() {
            let b = document.getElementById('actionBtn');
            if(state === "WAIT") {
                balance -= 10;
                document.getElementById('userBal').innerText = balance.toFixed(2);
                b.innerText = "Waiting..."; b.style.opacity = "0.7";
            } else if(state === "RUN" && b.innerText !== "Waiting...") {
                balance += (10 * mult);
                document.getElementById('userBal').innerText = balance.toFixed(2);
                b.innerText = "Win: " + (10 * mult).toFixed(1);
                b.style.opacity = "0.5";
            }
        }

        init();
    </script>
