<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Rocket Elite</title>
    <style>
        :root { --bg: #0b0e14; --card: #151921; --blue: #2483ff; --gold: #f59e0b; --text: #f0f2f5; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; direction: rtl; overflow: hidden; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(11, 14, 20, 0.9); position: sticky; top: 0; z-index: 100; }
        .user-tag { background: #1c212d; padding: 4px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #10b981; }
        .ton-bal { background: #1c212d; padding: 6px 14px; border-radius: 12px; display: flex; align-items: center; gap: 6px; font-weight: bold; border: 1px solid #2d344b; }

        /* Game Area */
        .game-container { height: 260px; position: relative; background: radial-gradient(circle at center, #161d2e 0%, #0b0e14 100%); overflow: hidden; }
        #multiplier { position: absolute; top: 35%; width: 100%; text-align: center; font-size: 65px; font-weight: 800; z-index: 10; color: #fff; text-shadow: 0 0 20px rgba(36,131,255,0.4); }
        #rocket { position: absolute; bottom: 30px; right: 30px; width: 90px; z-index: 5; transition: transform 0.1s linear; }

        /* History Line */
        .history-bar { display: flex; gap: 10px; padding: 12px; overflow-x: auto; background: #0b0e14; border-bottom: 1px solid #1c212d; }
        .h-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; min-width: 45px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .low { background: rgba(36,131,255,0.1); color: #2483ff; }
        .high { background: rgba(245,158,11,0.1); color: #f59e0b; }

        /* Bottom Menu */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: #151921; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #252b3d; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #8a91a8; }
        .nav-item.active { color: var(--blue); }

        /* Bet Modal (The Pop-up from video) */
        .bet-sheet { position: fixed; bottom: 65px; width: 100%; background: #1c212d; border-radius: 25px 25px 0 0; padding: 20px; box-sizing: border-box; transform: translateY(0); transition: 0.3s ease; border-top: 1px solid #2d344b; }
        .input-box { background: #0b0e14; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin: 15px 0; border: 1px solid #2d344b; }
        .input-box input { background: none; border: none; color: white; font-size: 20px; font-weight: bold; width: 50%; text-align: center; }
        
        .btn-bet { width: 100%; padding: 18px; border-radius: 18px; border: none; font-size: 18px; font-weight: bold; color: white; background: var(--blue); transition: 0.2s; }
        .btn-bet.collect { background: var(--gold); }

        /* Players Section */
        .players-scroll { height: calc(100vh - 580px); overflow-y: auto; padding: 15px; padding-bottom: 250px; }
        .player-card { display: flex; justify-content: space-between; padding: 12px; background: #151921; border-radius: 15px; margin-bottom: 10px; align-items: center; }
        .p-details { display: flex; align-items: center; gap: 12px; }
        .p-avatar { width: 40px; height: 40px; border-radius: 12px; background: #252b3d; }
        
        .gift-pop { position: absolute; font-size: 28px; animation: giftAnim 1.2s forwards; z-index: 20; }
        @keyframes giftAnim { 0% { transform: scale(0); opacity: 1; } 100% { transform: translateY(-120px) rotate(20deg); opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-tag">● 95</div>
        <div class="ton-bal">
            <span id="bal">1000.00</span>
            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="18" onclick="godMode()">
        </div>
    </div>

    <div class="game-container" id="stage">
        <div id="multiplier">1.00x</div>
        <img id="rocket" src="https://raw.githubusercontent.com/TelegramMessenger/Telegram-iOS/master/submodules/LegacyComponents/Resources/LegacyComponents.bundle/BaseSheetRocket%402x.png">
    </div>

    <div class="history-bar" id="history">
        <div class="h-tag high">x3.25</div>
        <div class="h-tag low">x1.49</div>
        <div class="h-tag high">x9.47</div>
        <div class="h-tag low">x1.04</div>
    </div>

    <div class="players-scroll" id="playerList">
        </div>

    <div class="bet-sheet">
        <div style="display:flex; justify-content:space-between; color:#8a91a8; font-size:12px;">
            <span>مبلغ الرهان</span>
            <span>الرصيد المتوفر: <span id="max">1000</span> TON</span>
        </div>
        <div class="input-box">
            <button onclick="adj(0.5)" style="color:var(--blue); background:none; border:none; font-weight:bold;">/2</button>
            <input type="number" id="amount" value="10.0">
            <button onclick="adj(2)" style="color:var(--blue); background:none; border:none; font-weight:bold;">x2</button>
        </div>
        <button id="mainBtn" class="btn-bet" onclick="handle()">Place TON Bet 🚀</button>
    </div>

    <div class="nav-bottom">
        <div class="nav-item active">🚀<span>Crash</span></div>
        <div class="nav-item">🎁<span>Gifts</span></div>
        <div class="nav-item">🏆<span>Stats</span></div>
        <div class="nav-item">👤<span>Profile</span></div>
    </div>

    <script>
        let bal = 1000, m = 1.0, active = false, god = false, loop, limit, bet = 10;

        function godMode() { god = !god; alert("System Status: " + (god ? "Bypassed" : "Standard")); }
        function adj(f) { let i = document.getElementById('amount'); i.value = (parseFloat(i.value) * f).toFixed(1); }

        function handle() { if(!active) start(); else collect(); }

        function start() {
            bet = parseFloat(document.getElementById('amount').value);
            if(bal < bet) return;
            bal -= bet; updateUI();
            active = true; m = 1.0;
            limit = god ? 80.0 : (Math.random() * 4 + 1.1);
            document.getElementById('mainBtn').innerText = "Cash Out";
            document.getElementById('mainBtn').classList.add('collect');
            
            loop = setInterval(() => {
                m += 0.01;
                document.getElementById('multiplier').innerText = m.toFixed(2) + "x";
                let move = (m - 1) * 60;
                document.getElementById('rocket').style.transform = `translate(-${move}px, -${move}px) rotate(45deg)`;
                if(m >= 2.5) {
                    document.getElementById('multiplier').style.color = "#f59e0b";
                    if(Math.random() > 0.8) spawnGift();
                }
                if(m >= limit) crash();
            }, 80);
        }

        function spawnGift() {
            const g = document.createElement('div');
            g.className = 'gift-pop';
            g.innerText = "🎁";
            g.style.left = Math.random() * 80 + '%';
            g.style.top = '40%';
            document.getElementById('stage').appendChild(g);
            setTimeout(() => g.remove(), 1200);
        }

        function collect() {
            clearInterval(loop);
            bal += (bet * m);
            addToHistory(m.toFixed(2));
            reset("Win: +" + (bet * m).toFixed(1));
        }

        function crash() {
            clearInterval(loop);
            document.getElementById('multiplier').innerText = "💥";
            addToHistory(m.toFixed(2));
            reset("Crashed!");
        }

        function reset(txt) {
            active = false;
            document.getElementById('mainBtn').innerText = txt;
            updateUI();
            setTimeout(() => {
                document.getElementById('mainBtn').innerText = "Place TON Bet 🚀";
                document.getElementById('mainBtn').classList.remove('collect');
                document.getElementById('multiplier').innerText = "1.00x";
                document.getElementById('multiplier').style.color = "white";
                document.getElementById('rocket').style.transform = "none";
            }, 2000);
        }

        function updateUI() {
            document.getElementById('bal').innerText = bal.toFixed(2);
            document.getElementById('max').innerText = bal.toFixed(0);
        }

        function addToHistory(v) {
            const h = document.getElementById('history');
            const tag = document.createElement('div');
            tag.className = `h-tag ${v > 2 ? 'high' : 'low'}`;
            tag.innerText = 'x' + v;
            h.prepend(tag);
        }

        function genPlayers() {
            const p = document.getElementById('playerList');
            const names = ["JOKER", "ANAS", "Tower", "Ahmed", "Murtada"];
            names.forEach(n => {
                p.innerHTML += `<div class="player-card">
                    <div class="p-details"><div class="p-avatar"></div><span>${n}</span></div>
                    <div style="text-align:left"><div style="font-size:12px">0.10 TON</div><div style="color:#10b981; font-size:11px">x1.04</div></div>
                </div>`;
            });
        }
        genPlayers();
    </script>
