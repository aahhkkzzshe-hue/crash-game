<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Crash Pro</title>
    <style>
        :root { --bg: #0b0e14; --card: #151921; --blue: #2483ff; --gold: #f59e0b; --green: #10b981; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; direction: rtl; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* الهيدر */
        .header { padding: 15px; background: #151921; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #252b3d; }
        .bal-chip { background: #0d1017; padding: 6px 12px; border-radius: 12px; border: 1px solid #2d344b; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        /* منطقة اللعب - ثابتة في الوسط */
        .game-view { height: 220px; min-height: 220px; background: radial-gradient(circle, #1a233a 0%, #0b0e14 100%); display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #multiplier { font-size: 55px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; }
        #timer-box { position: absolute; width: 80px; height: 80px; border: 4px solid var(--blue); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; background: rgba(11,14,20,0.8); z-index: 20; }
        #rocket { position: absolute; bottom: 20px; right: 20px; width: 75px; z-index: 5; transition: transform 0.1s linear; }

        /* قائمة اللاعبين - قابلة للتمرير */
        .players-section { flex-grow: 1; overflow-y: auto; padding: 10px; padding-bottom: 180px; }
        .player-card { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 15px; margin-bottom: 8px; border: 1px solid #252b3d; }
        .p-info { display: flex; align-items: center; gap: 10px; }
        .p-avatar { width: 35px; height: 35px; border-radius: 50%; background: #2d344b; }
        
        /* شكل الهدية داخل القائمة */
        .gift-tag { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold); border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; color: var(--gold); font-size: 12px; font-weight: bold; }

        /* الأزرار - ثابتة في الأسفل */
        .bottom-panel { position: fixed; bottom: 0; width: 100%; background: #151921; padding: 15px; border-top: 1px solid #252b3d; box-sizing: border-box; z-index: 100; }
        .input-group { display: flex; background: #0b0e14; border-radius: 12px; padding: 10px; margin-bottom: 12px; justify-content: space-between; align-items: center; border: 1px solid #2d344b; }
        .input-group input { background: none; border: none; color: white; text-align: center; font-size: 18px; width: 50%; outline: none; }
        .main-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 18px; font-weight: bold; color: white; background: var(--blue); }
        .main-btn.cashout { background: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div style="color:var(--green); font-size:13px;">● Live Session</div>
        <div class="bal-chip"><span id="bal">1000.00</span> <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="16"></div>
    </div>

    <div class="game-view">
        <div id="multiplier" style="display:none">1.00x</div>
        <div id="timer-box">5</div>
        <img id="rocket" src="https://i.postimg.cc/pT7L6L8v/rocket.png" style="display:none">
    </div>

    <div class="players-section" id="pList"></div>

    <div class="bottom-panel">
        <div class="input-group">
            <button onclick="adj(0.5)" style="color:var(--blue); background:none; border:none; font-weight:bold;">/2</button>
            <input type="number" id="betInput" value="10.0">
            <button onclick="adj(2)" style="color:var(--blue); background:none; border:none; font-weight:bold;">x2</button>
        </div>
        <button id="actionBtn" class="main-btn" onclick="handle()">Place Bet</button>
    </div>

    <script>
        let balance = 1000, m = 1.0, state = "WAIT", loop, limit;
        const names = ["احمد", "زيد", "مرتضى", "JOKER", "علي", "سجاد"];
        let players = [];

        function adj(f) { document.getElementById('betInput').value = (parseFloat(document.getElementById('betInput').value) * f).toFixed(1); }

        function init() {
            state = "WAIT"; m = 1.0;
            document.getElementById('multiplier').style.display = "none";
            document.getElementById('rocket').style.display = "none";
            document.getElementById('timer-box').style.display = "flex";
            document.getElementById('multiplier').style.color = "white";
            document.getElementById('actionBtn').innerText = "Place Bet";
            document.getElementById('actionBtn').classList.remove('cashout');
            
            let s = 5;
            document.getElementById('timer-box').innerText = s;
            players = names.map(n => ({ name: n, bet: (Math.random()*15+2).toFixed(1), exit: Math.random()*4+1.2, isOut: false }));
            render();

            let cd = setInterval(() => {
                s--; document.getElementById('timer-box').innerText = s;
                if(s <= 0) { clearInterval(cd); start(); }
            }, 1000);
        }

        function start() {
            state = "RUN";
            document.getElementById('timer-box').style.display = "none";
            document.getElementById('multiplier').style.display = "block";
            document.getElementById('rocket').style.display = "block";
            limit = Math.random() * 5 + 1.1;

            loop = setInterval(() => {
                m += 0.01;
                document.getElementById('multiplier').innerText = m.toFixed(2) + "x";
                let offset = (m - 1) * 60;
                document.getElementById('rocket').style.transform = `translate(-${offset}px, -${offset}px) rotate(45deg)`;
                
                if(m >= 2.5) document.getElementById('multiplier').style.color = "var(--gold)";
                
                render();
                if(m >= limit) crash();
            }, 80);
        }

        function render() {
            const list = document.getElementById('pList');
            list.innerHTML = '';
            players.forEach(p => {
                if(m >= p.exit) p.isOut = true;
                
                let val;
                if (m >= 2.5) {
                    val = `<div class="gift-tag"><img src="https://cdnn.iconscout.com/icon/free/png-256/free-telegram-gift-458051.png" width="16"> GIFT</div>`;
                } else {
                    val = `<span style="font-weight:bold; color:${p.isOut ? 'var(--green)' : 'white'}">${(p.bet * (p.isOut ? p.exit : m)).toFixed(2)}</span>`;
                }

                list.innerHTML += `<div class="player-card">
                    <div class="p-info"><div class="p-avatar"></div><span>${p.name}</span></div>
                    <div>${val}</div>
                </div>`;
            });
        }

        function crash() {
            clearInterval(loop);
            state = "END";
            document.getElementById('multiplier').innerText = "💥";
            document.getElementById('actionBtn').innerText = "Crashed!";
            setTimeout(init, 3000);
        }

        function handle() {
            if(state === "WAIT") {
                let val = parseFloat(document.getElementById('betInput').value);
                if(balance < val) return;
                balance -= val;
                document.getElementById('bal').innerText = balance.toFixed(2);
                document.getElementById('actionBtn').innerText = "Waiting...";
            }
        }

        init();
    </script>
</body>
</html>
