<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Crash UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #ffffff; overflow: hidden; height: 100vh; }
        .game-card { background: #15191e; border-radius: 16px; border: 1px solid #2b2f36; padding: 20px; }
        .multiplier-text { font-size: 4rem; font-weight: 800; color: #f0b90b; } /* لون الذهب المشهور */
        .player-row { background: #1e2329; border-radius: 8px; padding: 10px; margin-bottom: 5px; border-left: 4px solid #2b2f36; }
        .gift-status { color: #f0b90b; background: rgba(240, 185, 11, 0.1); padding: 2px 8px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        
        /* تثبيت العناصر */
        .main-container { height: 100vh; display: flex; flex-direction: column; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
        .control-panel { background: #15191e; padding: 20px; border-top: 2px solid #2b2f36; }
        .bet-btn { background: #f0b90b; border: none; color: #000; font-weight: bold; width: 100%; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="p-3 d-flex justify-content-between align-items-center border-bottom border-secondary">
        <span class="badge bg-success">Network: Live</span>
        <div class="fw-bold">Balance: <span id="balance">1000.00</span> TON</div>
    </div>

    <div class="game-card m-3 text-center">
        <div id="wait-msg" class="h5 text-secondary">Starting in...</div>
        <div id="multiplier" class="multiplier-text">1.00x</div>
    </div>

    <div class="scroll-area" id="players-list">
        </div>

    <div class="control-panel">
        <div class="input-group mb-3">
            <input type="number" id="bet-amount" class="form-control bg-dark text-white border-secondary" value="10.00">
            <span class="input-group-text bg-secondary text-white">TON</span>
        </div>
        <button id="action-btn" class="bet-btn">PLACE BET</button>
    </div>
</div>

<script>
    // هذا الجزء البرمجي يتبع المنطق العالمي للألعاب (Game Loop)
    let m = 1.0, isRunning = false, crashAt = 0;
    const names = ["Killer_7", "Alpha_Whale", "Shadow", "Tony_IQ", "Rex"];

    function resetRound() {
        isRunning = false;
        m = 1.0;
        document.getElementById('multiplier').innerText = "1.00x";
        document.getElementById('multiplier').style.color = "#f0b90b";
        document.getElementById('wait-msg').innerText = "Preparing Round...";
        
        setTimeout(() => {
            crashAt = (Math.random() * 5 + 1.1).toFixed(2);
            isRunning = true;
            document.getElementById('wait-msg').innerText = "Game in Progress";
            requestAnimationFrame(gameLoop);
        }, 3000);
    }

    function gameLoop() {
        if (!isRunning) return;
        m += 0.01;
        document.getElementById('multiplier').innerText = m.toFixed(2) + "x";

        renderPlayers();

        if (m >= crashAt) {
            isRunning = false;
            document.getElementById('multiplier').innerText = "💥 CRASHED";
            document.getElementById('multiplier').style.color = "#ff4d4d";
            setTimeout(resetRound, 3000);
        } else {
            setTimeout(() => requestAnimationFrame(gameLoop), 100);
        }
    }

    function renderPlayers() {
        const list = document.getElementById('players-list');
        list.innerHTML = '';
        names.forEach(name => {
            let info;
            // الشرط العالمي: تحويل الرهان لهدايا عند مضاعف معين
            if (m >= 2.5) {
                info = `<span class="gift-status">🎁 PREMIUM GIFT</span>`;
            } else {
                info = `<span class="text-info fw-bold">${(10 * m).toFixed(2)} TON</span>`;
            }

            list.innerHTML += `
                <div class="player-row d-flex justify-content-between align-items-center">
                    <span>👤 ${name}</span>
                    ${info}
                </div>`;
        });
    }

    resetRound(); // تشغيل اللعبة
</script>

</body>
</html>
