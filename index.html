<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Classic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --ton-color: #0098ea; --bg: #0b0f1a; }
        body { background-color: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow: hidden; user-select: none; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.03); border-bottom: 1px solid #1e293b; }
        .balance-box { display: flex; align-items: center; background: #161f32; padding: 5px 12px; border-radius: 50px; border: 1px solid #2e3c51; }
        .ton-icon { width: 22px; height: 22px; margin-right: 8px; cursor: pointer; } /* الزر السري هنا */
        #game-view { height: 55vh; position: relative; background: radial-gradient(circle at bottom, #161f32 0%, #0b0f1a 100%); }
        #rocket { position: absolute; bottom: 30px; left: 15%; font-size: 65px; transition: transform 0.1s linear; transform: rotate(-45deg); filter: drop-shadow(0 0 15px var(--ton-color)); }
        #multiplier { position: absolute; top: 35%; width: 100%; text-align: center; font-size: 70px; font-weight: 900; }
        .controls { padding: 25px; }
        .btn { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; border: none; border-radius: 18px; color: white; background: linear-gradient(180deg, #0098ea 0%, #0066cc 100%); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn.cashout { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: var(--ton-color); font-weight: bold;">CLASSIC</div>
        <div class="balance-box">
            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" class="ton-icon" onclick="toggleAdmin()">
            <span id="user-balance" style="font-weight: bold;">1,000.00</span>
        </div>
    </div>

    <div id="game-view">
        <div id="multiplier">1.00x</div>
        <div id="rocket">🚀</div>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn" onclick="handleAction()">ابدأ الرهان (100 TON)</button>
    </div>

    <script>
        const webapp = window.Telegram.WebApp;
        webapp.expand();

        let balance = 1000, multiplier = 1.0, isRunning = false, interval, crashPoint;
        let godMode = false; // الوضع السري

        // الوظيفة السرية: تفعيل وضع عدم الانفجار
        function toggleAdmin() {
            godMode = !godMode;
            // تذبذب بسيط بالموبايل كإشارة لك فقط إن الوضع تفعل
            if(webapp.HapticFeedback) webapp.HapticFeedback.notificationOccurred('success');
        }

        function handleAction() {
            if (!isRunning) start(); else cash();
        }

        function start() {
            if(balance < 100) return;
            balance -= 100;
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            isRunning = true; multiplier = 1.0;
            
            // إذا فعلت الوضع السري، تنفجر عند الـ 100x أو أكثر
            crashPoint = godMode ? (Math.random() * 50 + 100) : (Math.random() * 3.5 + 1.2);
            
            const btn = document.getElementById('actionBtn');
            btn.innerText = "اسحب الأرباح";
            btn.classList.add('cashout');

            interval = setInterval(() => {
                multiplier += 0.01;
                document.getElementById('multiplier').innerText = multiplier.toFixed(2) + "x";
                
                let h = (multiplier - 1) * 70, f = (multiplier - 1) * 15;
                document.getElementById('rocket').style.transform = `translate(${f}px, -${h}px) rotate(-45deg)`;

                if (multiplier >= crashPoint) boom();
            }, 70);
        }

        function cash() {
            clearInterval(interval);
            balance += (100 * multiplier);
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            isRunning = false;
            document.getElementById('actionBtn').innerText = "فزت بـ " + (100 * multiplier).toFixed(0);
            document.getElementById('actionBtn').disabled = true;
            setTimeout(reset, 2000);
        }

        function boom() {
            clearInterval(interval);
            isRunning = false;
            document.getElementById('multiplier').innerText = "💥";
            document.getElementById('rocket').style.transform = "scale(0)";
            document.getElementById('actionBtn').innerText = "خسرت!";
            document.getElementById('actionBtn').disabled = true;
            setTimeout(reset, 2000);
        }

        function reset() {
            const btn = document.getElementById('actionBtn');
            btn.disabled = false; btn.classList.remove('cashout');
            btn.innerText = "ابدأ الرهان (100 TON)";
            document.getElementById('rocket').style.transform = "rotate(-45deg)";
            document.getElementById('multiplier').innerText = "1.00x";
        }
    </script>
